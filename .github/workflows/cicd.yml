name: CI/CD

on:
  push:
    paths:
      - src/**
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Calculate short SHA and set env var
        run: echo "COMMIT_SHA_SHORT=${GITHUB_SHA:0:6}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: maker2413/flaskapp:${{ env.COMMIT_SHA_SHORT }}

    outputs:
      commit_sha_short: ${{ env.COMMIT_SHA_SHORT }}

  cd:
    needs: ci
    runs-on: arc-runner-set
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Update Helm Values
        run: |
          sudo apt update
          sudo apt install yq -y
          yq -Yi '.image.tag = "${{needs.ci.outputs.commit_sha_short}}"' charts/flaskapp/values.yaml

      - name: Commit Changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updates values.yaml with commit ${{needs.ci.outputs.commit_sha_short}}'

      - name: Instal ArgoCD Cli
        run: |
          curl -ksSL -o argocd http://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x ./argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: ArgoCD App Sync
        run: |
          argocd login argocd-server.argocd \
            --plaintext \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync flaskapp
